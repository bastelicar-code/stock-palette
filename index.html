<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stock Palette">
<link rel="manifest" href="manifest.json">
<title>Stock Palette</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f4f4;color:#1a1a1a;max-width:480px;margin:0 auto;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #e5e5e5;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.header h1{font-size:17px;font-weight:600;flex:1}
.header .sync-dot{width:8px;height:8px;border-radius:50%;background:#ccc}
.header .sync-dot.ok{background:#22c55e}
.header .sync-dot.syncing{background:#f59e0b;animation:pulse 1s infinite}
.header .sync-dot.offline{background:#ef4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.tabs{display:flex;background:#fff;border-bottom:1px solid #e5e5e5;position:sticky;top:57px;z-index:99}
.tab{flex:1;padding:11px 4px;font-size:12px;font-weight:500;text-align:center;border:none;background:transparent;color:#888;cursor:pointer;border-bottom:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:20px;height:20px}
.tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a}
.page{display:none;padding:12px;flex-direction:column;gap:10px}
.page.active{display:flex}
.card{background:#fff;border-radius:12px;border:1px solid #e5e5e5;padding:14px}
.card-title{font-size:13px;font-weight:600;margin-bottom:10px;color:#1a1a1a}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;color:#1a1a1a;background:#fff;outline:none;font-family:inherit}
input:focus,select:focus{border-color:#666}
.btn{padding:10px 16px;border-radius:8px;border:1px solid #ddd;background:#fff;font-size:14px;font-weight:500;cursor:pointer;color:#1a1a1a;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.btn:active{background:#f0f0f0}
.btn-primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.btn-primary:active{background:#333}
.btn-danger{color:#ef4444;border-color:#fca5a5}
.btn-success{color:#16a34a;border-color:#86efac}
.btn-full{width:100%;justify-content:center}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-green{background:#dcfce7;color:#15803d}
.badge-gray{background:#f3f4f6;color:#374151}
.badge-red{background:#fee2e2;color:#dc2626}
.row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0f0f0}
.row:last-child{border-bottom:none}
.row-name{font-size:14px;color:#1a1a1a;font-weight:500}
.row-sub{font-size:11px;color:#888;margin-top:2px;font-family:monospace}
.row-right{text-align:right;flex-shrink:0}
.scan-zone{border:2px dashed #ddd;border-radius:12px;padding:24px;text-align:center;cursor:pointer;background:#fafafa}
.scan-zone svg{width:40px;height:40px;color:#aaa;margin-bottom:8px}
.scan-zone p{font-size:13px;color:#888}
#video-wrap{display:none;border-radius:12px;overflow:hidden;position:relative}
#video{width:100%;height:220px;object-fit:cover;background:#000;display:block}
.video-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:200px;height:120px;border:2px solid #fff;border-radius:4px;pointer-events:none}
.status{font-size:12px;text-align:center;padding:6px;min-height:22px;color:#16a34a;font-weight:500}
.result-ok{background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:14px}
.result-ok .big{font-size:26px;font-weight:700;color:#15803d}
.result-ok .sub{font-size:13px;color:#166534;margin-top:4px}
.result-no{background:#fef2f2;border:1px solid #fca5a5;border-radius:12px;padding:14px}
.result-no p{font-size:14px;color:#dc2626}
.prenom-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:16px;background:#f4f4f4}
.prenom-screen h2{font-size:20px;font-weight:700;text-align:center}
.prenom-screen p{font-size:14px;color:#666;text-align:center}
.offline-banner{background:#fef3c7;border-bottom:1px solid #fde68a;padding:8px 16px;font-size:12px;color:#92400e;text-align:center;display:none}
.qty-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.palette-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.history-item{padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
.history-item:last-child{border-bottom:none}
.history-action-add{color:#16a34a}
.history-action-remove{color:#dc2626}
.empty{font-size:13px;color:#888;padding:12px 0;text-align:center}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #ddd;border-top-color:#666;border-radius:50%;animation:spin 0.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="prenom-screen" class="prenom-screen">
  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5"><path d="M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M16 3H8a2 2 0 00-2 2v2h12V5a2 2 0 00-2-2z"/></svg>
  <h2>Stock Palette</h2>
  <p>Entre ton prénom pour commencer. Il sera affiché quand tu ajoutes ou retires un produit.</p>
  <input type="text" id="prenom-input" placeholder="Ton prénom..." style="max-width:280px;text-align:center;font-size:16px" maxlength="20" />
  <button class="btn btn-primary" onclick="savePrenom()" style="max-width:280px;width:100%;justify-content:center">Commencer</button>
</div>

<div id="app" style="display:none">
  <div class="offline-banner" id="offline-banner">Mode hors-ligne — les données se synchroniseront à la reconnexion</div>
  <div class="header">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M16 3H8a2 2 0 00-2 2v2h12V5a2 2 0 00-2-2z"/></svg>
    <h1>Stock Palette</h1>
    <span id="user-name" style="font-size:12px;color:#888"></span>
    <div class="sync-dot" id="sync-dot" title="Statut connexion"></div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="showPage('scanner')" id="tab-scanner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
      Scanner
    </button>
    <button class="tab" onclick="showPage('recherche')" id="tab-recherche">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Chercher
    </button>
    <button class="tab" onclick="showPage('palettes')" id="tab-palettes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Palettes
    </button>
  </div>

  <!-- PAGE SCANNER -->
  <div class="page active" id="page-scanner">
    <div class="card">
      <div class="card-title">Palette active</div>
      <div style="display:flex;gap:8px;align-items:center">
        <select id="palette-select" style="flex:1" onchange="onPaletteChange()">
          <option value="">-- Choisir une palette --</option>
        </select>
        <button class="btn" onclick="newPalette()" title="Nouvelle palette">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nouvelle
        </button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Ajouter un produit</div>
      <div class="scan-zone" onclick="startCamera()" id="scan-zone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <p>Appuyer pour scanner</p>
      </div>
      <div id="video-wrap">
        <video id="video" autoplay playsinline muted></video>
        <div class="video-overlay"></div>
        <button class="btn btn-danger btn-full" onclick="stopCamera()" style="margin-top:8px">Arrêter le scan</button>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <input type="text" id="manual-input" placeholder="Nom ou code-barre..." />
        <button class="btn" onclick="addManual()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <div class="qty-row">
        <div>
          <label style="font-size:12px;color:#888;display:block;margin-bottom:4px">Quantité</label>
          <input type="number" id="qty-input" value="1" min="1" max="9999" style="text-align:center" />
        </div>
        <div>
          <label style="font-size:12px;color:#888;display:block;margin-bottom:4px">Conditionnement</label>
          <select id="cond-input">
            <option value="unité">Unité</option>
            <option value="carton" selected>Carton</option>
            <option value="palette">Palette</option>
            <option value="pack">Pack</option>
            <option value="caisse">Caisse</option>
          </select>
        </div>
      </div>
      <div class="status" id="scan-status"></div>
    </div>

    <div class="card" id="recent-card" style="display:none">
      <div class="card-title">Derniers ajouts</div>
      <div id="recent-list"></div>
    </div>
  </div>

  <!-- PAGE RECHERCHE -->
  <div class="page" id="page-recherche">
    <div class="card">
      <div class="card-title">Trouver un produit</div>
      <input type="text" id="search-input" placeholder="Nom ou code-barre..." oninput="doSearch()" />
    </div>
    <div id="search-result"></div>
  </div>

  <!-- PAGE PALETTES -->
  <div class="page" id="page-palettes">
    <div id="palettes-container"></div>
    <button class="btn btn-full" onclick="newPalette()" style="background:#fff">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Créer une nouvelle palette
    </button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc, getDoc, getDocs, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCPWmhoXEv8MvaywyisUS6IayhK0iWElcQ",
  authDomain: "stock-palette.firebaseapp.com",
  projectId: "stock-palette",
  storageBucket: "stock-palette.firebasestorage.app",
  messagingSenderId: "79905435298",
  appId: "1:79905435298:web:c9e0404b7ff042569ff1fb"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

enableIndexedDbPersistence(db).catch(() => {});

let palettes = {};
let prenom = localStorage.getItem('sp_prenom') || '';
let codeReader = null;
let scanning = false;

window.setSyncStatus = function(status) {
  const dot = document.getElementById('sync-dot');
  const banner = document.getElementById('offline-banner');
  dot.className = 'sync-dot ' + status;
  banner.style.display = status === 'offline' ? 'block' : 'none';
}

window.addEventListener('online', () => setSyncStatus('ok'));
window.addEventListener('offline', () => setSyncStatus('offline'));
setSyncStatus(navigator.onLine ? 'ok' : 'offline');

if (prenom) {
  document.getElementById('prenom-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('user-name').textContent = prenom;
  initFirestore();
}

window.savePrenom = function() {
  const v = document.getElementById('prenom-input').value.trim();
  if (!v) return;
  prenom = v;
  localStorage.setItem('sp_prenom', v);
  document.getElementById('prenom-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('user-name').textContent = prenom;
  initFirestore();
}

document.getElementById('prenom-input').addEventListener('keydown', e => { if(e.key==='Enter') window.savePrenom(); });

function initFirestore() {
  setSyncStatus('syncing');
  onSnapshot(collection(db, 'palettes'), snap => {
    palettes = {};
    snap.forEach(d => { palettes[d.id] = d.data(); });
    setSyncStatus('ok');
    renderAll();
  }, () => setSyncStatus('offline'));
}

function renderAll() {
  renderSelect();
  renderPalettesPage();
  const pid = document.getElementById('palette-select').value;
  if (pid && palettes[pid]) renderRecent(pid);
}

function renderSelect() {
  const sel = document.getElementById('palette-select');
  const cur = sel.value;
  sel.innerHTML = '<option value="">-- Choisir une palette --</option>';
  Object.keys(palettes).sort().forEach(id => {
    const p = palettes[id];
    const count = (p.produits || []).filter(x => !x.sorti).length;
    const o = document.createElement('option');
    o.value = id;
    o.textContent = id + (p.cloturee ? ' [clôturée]' : '') + ' — ' + count + ' réf.';
    sel.appendChild(o);
  });
  if (cur && palettes[cur]) sel.value = cur;
}

window.onPaletteChange = function() {
  const pid = document.getElementById('palette-select').value;
  if (pid && palettes[pid]) renderRecent(pid);
  else { document.getElementById('recent-card').style.display='none'; }
}

window.newPalette = async function() {
  setSyncStatus('syncing');
  const ids = Object.keys(palettes).map(id => parseInt(id.replace('P',''))).filter(n => !isNaN(n));
  const next = ids.length ? Math.max(...ids) + 1 : 1;
  const id = 'P' + String(next).padStart(3,'0');
  await setDoc(doc(db, 'palettes', id), {
    produits: [],
    historique: [],
    cloturee: false,
    creee: new Date().toLocaleDateString('fr-FR'),
    creePar: prenom
  });
  document.getElementById('palette-select').value = id;
  showStatus('Palette ' + id + ' créée', 'ok');
}

window.addManual = function() {
  const v = document.getElementById('manual-input').value.trim();
  if (!v) return;
  addProduct(v, v);
  document.getElementById('manual-input').value = '';
}

async function addProduct(code, name) {
  const pid = document.getElementById('palette-select').value;
  if (!pid) { showStatus('Choisissez une palette', 'warn'); return; }
  const p = palettes[pid];
  if (!p) return;
  if (p.cloturee) {
    if (!confirm('Cette palette est clôturée. La rouvrir pour ajouter ?')) return;
    await updateDoc(doc(db, 'palettes', pid), { cloturee: false });
  }
  const qty = parseInt(document.getElementById('qty-input').value) || 1;
  const cond = document.getElementById('cond-input').value;
  const heure = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
  const produit = { id: Date.now().toString(), code, name, qty, cond, heure, ajoutePar: prenom, sorti: false };
  const hist = { action:'ajout', code, name, qty, cond, heure, par: prenom };
  const produits = [...(p.produits||[]), produit];
  const historique = [...(p.historique||[]), hist];
  setSyncStatus('syncing');
  await updateDoc(doc(db, 'palettes', pid), { produits, historique });
  showStatus('Ajouté à ' + pid, 'ok');
}

window.startCamera = async function() {
  const pid = document.getElementById('palette-select').value;
  if (!pid) { showStatus('Choisissez une palette', 'warn'); return; }
  document.getElementById('scan-zone').style.display = 'none';
  document.getElementById('video-wrap').style.display = 'block';
  try {
    const { BrowserMultiFormatReader } = await import('https://esm.sh/@zxing/library@0.19.1');
    codeReader = new BrowserMultiFormatReader();
    scanning = true;
    await codeReader.decodeFromVideoDevice(null, 'video', (result, err) => {
      if (result && scanning) {
        scanning = false;
        const code = result.getText();
        stopCamera();
        addProduct(code, code);
      }
    });
  } catch(e) {
    stopCamera();
    showStatus('Caméra non disponible', 'warn');
  }
}

window.stopCamera = function() {
  scanning = false;
  if (codeReader) { try { codeReader.reset(); } catch(e){} codeReader = null; }
  document.getElementById('scan-zone').style.display = 'block';
  document.getElementById('video-wrap').style.display = 'none';
}

function showStatus(msg, type) {
  const el = document.getElementById('scan-status');
  el.textContent = msg;
  el.style.color = type === 'ok' ? '#16a34a' : '#d97706';
  setTimeout(() => el.textContent = '', 3000);
}

function renderRecent(pid) {
  const p = palettes[pid];
  if (!p) return;
  const prods = [...(p.produits||[])].reverse().slice(0, 6);
  const card = document.getElementById('recent-card');
  const list = document.getElementById('recent-list');
  if (!prods.length) { card.style.display='none'; return; }
  card.style.display = 'block';
  list.innerHTML = prods.map(pr => `
    <div class="row">
      <div>
        <div class="row-name">${pr.name}</div>
        <div class="row-sub">${pr.qty} ${pr.cond} · ${pr.heure} · ${pr.ajoutePar}</div>
      </div>
      <div class="row-right">
        ${pr.sorti
          ? '<span class="badge badge-gray">Sorti</span>'
          : `<button class="btn btn-success" style="padding:5px 10px;font-size:12px" onclick="retirerProduit('${pid}','${pr.id}')">Sortir</button>`}
      </div>
    </div>`).join('');
}

window.retirerProduit = async function(pid, prodId) {
  const p = palettes[pid];
  if (!p) return;
  const heure = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
  const produits = (p.produits||[]).map(pr => pr.id === prodId ? {...pr, sorti:true, sortiePar:prenom, sortieHeure:heure} : pr);
  const prod = (p.produits||[]).find(pr => pr.id === prodId);
  const historique = [...(p.historique||[]), { action:'sortie', code:prod?.code, name:prod?.name, qty:prod?.qty, cond:prod?.cond, heure, par:prenom }];
  setSyncStatus('syncing');
  await updateDoc(doc(db, 'palettes', pid), { produits, historique });
}

window.cloturerPalette = async function(pid) {
  if (!confirm('Clôturer la palette ' + pid + ' ?')) return;
  setSyncStatus('syncing');
  await updateDoc(doc(db, 'palettes', pid), { cloturee: true });
}

window.rouvrirPalette = async function(pid) {
  setSyncStatus('syncing');
  await updateDoc(doc(db, 'palettes', pid), { cloturee: false });
}

window.supprimerPalette = async function(pid) {
  if (!confirm('Supprimer définitivement la palette ' + pid + ' ? Cette action est irréversible.')) return;
  setSyncStatus('syncing');
  await deleteDoc(doc(db, 'palettes', pid));
}

function renderPalettesPage() {
  const container = document.getElementById('palettes-container');
  const ids = Object.keys(palettes).sort();
  if (!ids.length) {
    container.innerHTML = '<div class="card"><p class="empty">Aucune palette créée.</p></div>';
    return;
  }
  container.innerHTML = ids.map(id => {
    const p = palettes[id];
    const total = (p.produits||[]).length;
    const actifs = (p.produits||[]).filter(x => !x.sorti).length;
    const sortis = total - actifs;
    return `<div class="card" style="margin-bottom:0">
      <div class="palette-header">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:16px;font-weight:700">${id}</span>
          <span class="badge ${p.cloturee ? 'badge-gray' : 'badge-blue'}">${p.cloturee ? 'Clôturée' : 'Ouverte'}</span>
        </div>
        <span style="font-size:12px;color:#888">${p.creee||''}</span>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <div style="flex:1;background:#f9fafb;border-radius:8px;padding:8px;text-align:center">
          <div style="font-size:20px;font-weight:700;color:#1a1a1a">${actifs}</div>
          <div style="font-size:11px;color:#888">en stock</div>
        </div>
        <div style="flex:1;background:#f9fafb;border-radius:8px;padding:8px;text-align:center">
          <div style="font-size:20px;font-weight:700;color:#888">${sortis}</div>
          <div style="font-size:11px;color:#888">sortis</div>
        </div>
      </div>
      <div id="detail-${id}" style="display:none">
        ${renderProduits(id, p)}
        <div style="margin-top:10px">
          <div style="font-size:12px;font-weight:600;color:#888;margin-bottom:6px">Historique</div>
          ${renderHistorique(p)}
        </div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn" style="font-size:12px;padding:6px 10px" onclick="toggleDetail('${id}')">Détail</button>
        ${p.cloturee
          ? `<button class="btn btn-success" style="font-size:12px;padding:6px 10px" onclick="rouvrirPalette('${id}')">Rouvrir</button>`
          : `<button class="btn" style="font-size:12px;padding:6px 10px" onclick="cloturerPalette('${id}')">Clôturer</button>`}
        <button class="btn btn-danger" style="font-size:12px;padding:6px 10px;margin-left:auto" onclick="supprimerPalette('${id}')">Supprimer</button>
      </div>
    </div>`;
  }).join('<div style="height:10px"></div>');
}

function renderProduits(pid, p) {
  const prods = p.produits || [];
  if (!prods.length) return '<p class="empty">Aucun produit</p>';
  return prods.map(pr => `
    <div class="row">
      <div>
        <div class="row-name">${pr.name}</div>
        <div class="row-sub">${pr.qty} ${pr.cond} · ${pr.heure} · ${pr.ajoutePar}</div>
        ${pr.sorti ? `<div style="font-size:11px;color:#dc2626">Sorti ${pr.sortieHeure} par ${pr.sortiePar}</div>` : ''}
      </div>
      <div class="row-right">
        ${pr.sorti
          ? '<span class="badge badge-gray">Sorti</span>'
          : `<button class="btn btn-success" style="padding:5px 8px;font-size:12px" onclick="retirerProduit('${pid}','${pr.id}')">Sortir</button>`}
      </div>
    </div>`).join('');
}

function renderHistorique(p) {
  const hist = [...(p.historique||[])].reverse().slice(0,10);
  if (!hist.length) return '<p class="empty">Aucun historique</p>';
  return hist.map(h => `
    <div class="history-item">
      <span class="${h.action==='ajout' ? 'history-action-add' : 'history-action-remove'}">${h.action==='ajout' ? '+ Ajout' : '- Sortie'}</span>
      — ${h.name} (${h.qty} ${h.cond}) · ${h.heure} · <strong>${h.par}</strong>
    </div>`).join('');
}

window.toggleDetail = function(id) {
  const el = document.getElementById('detail-'+id);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

window.doSearch = function() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const res = document.getElementById('search-result');
  if (!q) { res.innerHTML=''; return; }
  const found = [];
  Object.keys(palettes).forEach(pid => {
    (palettes[pid].produits||[]).forEach(pr => {
      if (!pr.sorti && (pr.name.toLowerCase().includes(q) || pr.code.toLowerCase().includes(q))) {
        found.push({ pid, ...pr });
      }
    });
  });
  if (!found.length) {
    res.innerHTML = `<div class="result-no"><p>Produit introuvable en stock palette.<br><small style="color:#888">Il est peut-être déjà en rayon ou n'a pas été scanné.</small></p></div>`;
    return;
  }
  res.innerHTML = found.map(f => `
    <div class="result-ok" style="margin-bottom:8px">
      <div style="font-size:12px;color:#15803d;margin-bottom:4px">Produit trouvé</div>
      <div class="big">Palette ${f.pid}</div>
      <div class="sub"><strong>${f.name}</strong></div>
      <div class="sub">${f.qty} ${f.cond} · Ajouté à ${f.heure} par ${f.ajoutePar}</div>
      <div class="sub" style="font-family:monospace;margin-top:4px;font-size:11px">${f.code}</div>
      <button class="btn btn-danger" style="margin-top:10px;font-size:12px;padding:6px 12px" onclick="retirerDepuisRecherche('${f.pid}','${f.id}')">
        Marquer comme sorti en rayon
      </button>
    </div>`).join('');
}

window.retirerDepuisRecherche = async function(pid, prodId) {
  await window.retirerProduit(pid, prodId);
  setTimeout(() => window.doSearch(), 500);
}

window.showPage = function(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  if (name !== 'scanner') stopCamera();
}
</script>
</body>
</html>
